port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  # Public IP for WebRTC — set via env substitution in compose; fallback ke auto-detect kalau kosong
  use_external_ip: true
  # Uncomment & set manually if UPnP/STUN auto-detection gagal:
  # external_ip: "YOUR_VPS_PUBLIC_IP"

  # Tingkatkan stabilitas pada koneksi buruk
  stun_servers:
    - "stun:stun.l.google.com:19302"
    - "stun:stun1.l.google.com:19302"

turn:
  enabled: false
  # Kita pakai coturn standalone, bukan built-in LiveKit TURN.

keys:
  # Key/secret disuplai lewat env LIVEKIT_KEYS di compose

logging:
  level: info
  json: false

room:
  enabled_codecs:
    - mime: audio/opus
    - mime: video/vp9
    - mime: video/vp8
    - mime: video/h264
    - mime: video/av1
  max_participants: 100
  empty_timeout: 300      # hapus room kosong setelah 5 menit
  departure_timeout: 20   # slot peserta disimpan 20 detik untuk reconnect

# Simulcast otomatis aktif di client; konfigurasi tambahan di sini jika perlu
video:
  hide_participant_from_token_with_no_permissions: false
